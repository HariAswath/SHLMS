const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/** Short human stamp used across tables and timelines, e.g. "30 Aug, 14:05". */
function stamp(d = new Date()) {
  return `${pad(d.getDate())} ${MONTHS[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/** Trigger a real browser download for the generated report blobs. */
function downloadBlob(filename, mime, content) {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (err) {
    return false;
  }
}

/** Minimal single-page PDF writer — enough for a text report, no library. */
function buildPdf(title, lines) {
  const esc = (s) => String(s).replace(/([\()])/g, "\$1").replace(/[^\x20-\x7E]/g, "?");
  let content = "BT\n/F1 16 Tf\n56 786 Td\n" + `(${esc(title)}) Tj\n` + "ET\n";
  content += "0.88 0.89 0.91 RG\n1 w\n56 776 m 539 776 l S\n";
  let y = 752;
  content += "BT\n/F2 10 Tf\n";
  let first = true;
  for (const line of lines.slice(0, 60)) {
    if (y < 56) break;
    content += first ? `56 ${y} Td\n` : `0 -16 Td\n`;
    content += `(${esc(line)}) Tj\n`;
    first = false;
    y -= 16;
  }
  content += "ET\n";

  const objs = [
    "<</Type/Catalog/Pages 2 0 R>>",
    "<</Type/Pages/Kids[3 0 R]/Count 1>>",
    "<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 4 0 R>>",
    `<</Length ${content.length}>>\nstream\n${content}endstream`,
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>",
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>",
  ];

  let pdf = "%PDF-1.4\n";
  const offsets = [];
  objs.forEach((body, i) => {
    offsets.push(pdf.length);
    pdf += `${i + 1} 0 obj\n${body}\nendobj\n`;
  });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
  offsets.forEach((o) => { pdf += `${String(o).padStart(10, "0")} 00000 n \n`; });
  pdf += `trailer\n<</Size ${objs.length + 1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return pdf;
}

const StoreContext = createContext(null);
const useStore = () => useContext(StoreContext);

function StoreProvider({ children }) {
  const [records, setRecords] = useState(SEED_RECORDS);
  const [complaints, setComplaints] = useState(SEED_COMPLAINTS);
  const [lostItems, setLostItems] = useState(SEED_LOST);
  const [users, setUsers] = useState(SEED_USERS);
  const [schedule, setSchedule] = useState(SEED_SCHEDULE);
  const [blackouts, setBlackouts] = useState(SEED_BLACKOUTS);
  const [feedback, setFeedback] = useState(SEED_FEEDBACK);
  const [notifications, setNotifications] = useState(SEED_NOTIFICATIONS);
  const [toasts, setToasts] = useState([]);

  const toast = useCallback((text, tone = "success") => {
    const id = uid("T");
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4000);
  }, []);

  const dismissToast = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);

  const notify = useCallback((audience, text) => {
    setNotifications((n) => [{ id: uid("N"), audience, text, at: stamp(), read: false }, ...n]);
  }, []);

  const markAllRead = useCallback((audience) => {
    setNotifications((n) => n.map((x) => (x.audience === audience ? { ...x, read: true } : x)));
  }, []);

  /* --- laundry lifecycle ------------------------------------------ */

  const submitLaundry = useCallback((payload) => {
    const id = uid("LR");
    const at = stamp();
    const record = rec({
      id,
      regNo: payload.regNo,
      student: payload.student,
      block: payload.block,
      room: payload.room,
      items: payload.items,
      remarks: payload.remarks,
      status: "Received",
      staff: payload.staff,
      submittedAt: at,
      timeline: { Scheduled: at, Received: at },
    });
    setRecords((r) => [record, ...r]);
    notify("student", `Laundry ${id} received at the counter — ${record.itemCount} items logged.`);
    notify("admin", `${payload.student} submitted ${record.itemCount} items (${id}).`);
    toast(`${id} submitted — ${record.itemCount} items, ${record.weightKg} kg`);
    return record;
  }, [notify, toast]);

  const advanceRecord = useCallback((id) => {
    let message = "";
    setRecords((rs) => rs.map((r) => {
      if (r.id !== id) return r;
      const next = STATUS_STEPS[STATUS_STEPS.indexOf(r.status) + 1];
      if (!next || next === "Delivered") return r; // delivery only happens through OTP
      const at = stamp();
      message = `${id} moved to ${next}.`;
      return {
        ...r,
        status: next,
        otp: next === "Ready for Pickup" ? r.otp || randomOtp() : r.otp,
        timeline: { ...r.timeline, [next]: at },
      };
    }));
    if (message) {
      notify("student", message);
      toast(message);
    }
  }, [notify, toast]);

  const verifyOtp = useCallback((id, code) => {
    const record = records.find((r) => r.id === id);
    if (!record) return { ok: false, reason: "No such laundry record." };
    if (record.status !== "Ready for Pickup") {
      return { ok: false, reason: `${id} is ${record.status} — not yet ready for handover.` };
    }
    if (code !== record.otp) return { ok: false, reason: "Incorrect OTP. Ask the student to re-read the code." };
    const at = stamp();
    setRecords((rs) => rs.map((r) => (
      r.id === id ? { ...r, status: "Delivered", deliveredAt: at, timeline: { ...r.timeline, Delivered: at } } : r
    )));
    notify("student", `${id} handed over. Pickup confirmation email sent.`);
    notify("admin", `${id} delivered to ${record.student}.`);
    toast(`${id} delivered — confirmation email sent to ${record.student}`);
    return { ok: true, record };
  }, [records, notify, toast]);

  /* --- complaints -------------------------------------------------- */

  const raiseComplaint = useCallback((payload) => {
    const id = uid("CMP");
    const complaint = {
      id,
      recordId: payload.recordId,
      regNo: ME.regNo,
      student: ME.name,
      category: payload.category,
      subject: payload.subject,
      description: payload.description,
      photo: payload.photo || null,
      status: "Open",
      createdAt: stamp(),
      handler: records.find((r) => r.id === payload.recordId)?.staff || "—",
      resolution: "",
    };
    setComplaints((c) => [complaint, ...c]);
    notify("admin", `New complaint ${id} — ${payload.category} on ${payload.recordId}.`);
    toast(`Complaint ${id} submitted for review`);
    return complaint;
  }, [records, notify, toast]);

  const updateComplaintStatus = useCallback((id, status) => {
    setComplaints((c) => c.map((x) => (x.id === id ? { ...x, status } : x)));
    toast(`${id} marked ${status}`, "info");
  }, [toast]);

  const resolveComplaint = useCallback((id, resolution) => {
    setComplaints((c) => c.map((x) => (
      x.id === id ? { ...x, status: "Resolved", resolution, resolvedAt: stamp() } : x
    )));
    notify("student", `Complaint ${id} has been resolved.`);
    toast(`${id} resolved — student notified`);
  }, [notify, toast]);

  /* --- lost & found ------------------------------------------------ */

  const addLostItem = useCallback((payload) => {
    const id = uid("LF");
    setLostItems((l) => [{ ...payload, id, status: "Available", claim: null }, ...l]);
    notify("student", `New unclaimed item listed in Lost & Found (${id}).`);
    toast(`Lost item ${id} published to the board`);
  }, [notify, toast]);

  const claimLostItem = useCallback((id, proof) => {
    setLostItems((l) => l.map((x) => (
      x.id === id
        ? { ...x, status: "Claim Pending", claim: { by: ME.name, regNo: ME.regNo, proof, at: stamp() } }
        : x
    )));
    notify("admin", `Claim submitted for ${id} by ${ME.name} — awaiting verification.`);
    toast(`Claim for ${id} sent to the hostel office`);
  }, [notify, toast]);

  const settleClaim = useCallback((id, approve) => {
    setLostItems((l) => l.map((x) => (
      x.id === id ? { ...x, status: approve ? "Returned" : "Available", claim: approve ? x.claim : null } : x
    )));
    notify("student", approve
      ? `Your claim for ${id} was approved — collect it from the laundry desk.`
      : `Your claim for ${id} could not be verified. The item is back on the board.`);
    toast(approve ? `${id} released to claimant` : `Claim on ${id} rejected`, approve ? "success" : "danger");
  }, [notify, toast]);

  /* --- users, schedule, feedback ------------------------------------ */

  const addUser = useCallback((user) => {
    setUsers((u) => [{ ...user, id: uid("U"), status: "Active" }, ...u]);
    toast(`${user.name} added as ${user.role}`);
  }, [toast]);

  const toggleUser = useCallback((id) => {
    setUsers((us) => us.map((u) => (
      u.id === id ? { ...u, status: u.status === "Active" ? "Suspended" : "Active" } : u
    )));
  }, []);

  const removeUser = useCallback((id) => {
    setUsers((us) => us.filter((u) => u.id !== id));
    toast("Account removed", "danger");
  }, [toast]);

  const reassignBlock = useCallback((block, day) => {
    setSchedule((s) => ({ ...s, [block]: day }));
    notify("student", `${block} laundry day moved to ${day}.`);
    notify("staff", `${block} is now collected on ${day}.`);
    toast(`${block} reassigned to ${day}`);
  }, [notify, toast]);

  const addBlackout = useCallback((date, reason) => {
    setBlackouts((b) => [...b, { id: uid("BO"), date, reason }]);
    toast(`Blackout added for ${date}`, "info");
  }, [toast]);

  const removeBlackout = useCallback((id) => setBlackouts((b) => b.filter((x) => x.id !== id)), []);

  const submitFeedback = useCallback((payload) => {
    const id = uid("FB");
    setFeedback((f) => [{ ...payload, id, regNo: ME.regNo, student: ME.name, at: stamp() }, ...f]);
    notify("admin", `New ${payload.overall}-star rating on ${payload.recordId}.`);
    toast("Thanks — your rating was recorded");
  }, [notify, toast]);

  const value = useMemo(() => ({
    records, complaints, lostItems, users, schedule, blackouts, feedback, notifications, toasts,
    toast, dismissToast, notify, markAllRead,
    submitLaundry, advanceRecord, verifyOtp,
    raiseComplaint, updateComplaintStatus, resolveComplaint,
    addLostItem, claimLostItem, settleClaim,
    addUser, toggleUser, removeUser,
    reassignBlock, addBlackout, removeBlackout, submitFeedback,
  }), [
    records, complaints, lostItems, users, schedule, blackouts, feedback, notifications, toasts,
    toast, dismissToast, notify, markAllRead, submitLaundry, advanceRecord, verifyOtp,
    raiseComplaint, updateComplaintStatus, resolveComplaint, addLostItem, claimLostItem,
    settleClaim, addUser, toggleUser, removeUser, reassignBlock, addBlackout, removeBlackout,
    submitFeedback,
  ]);

  return <StoreContext.Provider value={value}>{children}</StoreContext.Provider>;
}

/**
 * Shared table renderer. `columns` is [{ key, label, align }] and `render`
 * returns the cell body for a given row + column key.
 */
function Table({ columns, rows, render, empty = "Nothing here yet.", rowKey = (r, i) => r.id || i }) {
  if (!rows.length) return <EmptyState title={empty} />;
  return (
    <div className="overflow-x-auto rounded-xl border border-slate-200">
      <table className="w-full min-w-[640px] text-left text-sm">
        <thead className="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
          <tr>
            {columns.map((c) => (
              <th
                key={c.key}
                className={classNames("px-4 py-3 font-medium", c.align === "right" && "text-right")}
              >
                {c.label}
              </th>
            ))}
          </tr>
        </thead>
        <tbody className="divide-y divide-slate-100">
          {rows.map((row, i) => (
            <tr key={rowKey(row, i)} className="transition-colors hover:bg-slate-50/70">
              {columns.map((c) => (
                <td
                  key={c.key}
                  className={classNames("px-4 py-3 align-middle text-slate-700", c.align === "right" && "text-right")}
                >
                  {render(row, c.key)}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Modal({ open, onClose, title, subtitle, children, footer, width = "max-w-lg" }) {
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/40 p-4 backdrop-blur-[2px] sm:p-8">
      <div className="absolute inset-0" onClick={onClose} aria-hidden="true" />
      <div
        className={classNames(
          "relative z-10 my-auto w-full animate-[modalIn_140ms_ease-out] rounded-xl border border-slate-200 bg-white shadow-xl",
          width,
        )}
        role="dialog"
        aria-modal="true"
      >
        <div className="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-4">
          <div>
            <h3 className="text-base font-semibold text-slate-900">{title}</h3>
            {subtitle && <p className="mt-0.5 text-sm text-slate-500">{subtitle}</p>}
          </div>
          <button
            onClick={onClose}
            className="rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
            aria-label="Close"
          >
            <X size={16} />
          </button>
        </div>
        <div className="px-6 py-5">{children}</div>
        {footer && (
          <div className="flex flex-wrap justify-end gap-2 border-t border-slate-100 bg-slate-50/60 px-6 py-4">
            {footer}
          </div>
        )}
      </div>
    </div>
  );
}

/** Photo attachment control — real FileReader preview, no upload endpoint. */
function PhotoPicker({ value, onChange, hint = "PNG or JPG, up to ~2 MB" }) {
  const inputRef = useRef(null);
  const [dragging, setDragging] = useState(false);

  const read = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onChange({ name: file.name, dataUrl: String(reader.result) });
    reader.readAsDataURL(file);
  };

  if (value) {
    return (
      <div className="flex items-center gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
        <img src={value.dataUrl} alt={value.name} className="h-16 w-16 rounded-lg border border-slate-200 object-cover" />
        <div className="min-w-0 flex-1">
          <p className="truncate text-sm font-medium text-slate-800">{value.name}</p>
          <p className="text-xs text-slate-400">Attached as evidence</p>
        </div>
        <Button variant="ghost" size="sm" type="button" onClick={() => onChange(null)}>
          <Trash2 size={14} /> Remove
        </Button>
      </div>
    );
  }

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
      onDragLeave={() => setDragging(false)}
      onDrop={(e) => { e.preventDefault(); setDragging(false); read(e.dataTransfer.files?.[0]); }}
      onClick={() => inputRef.current?.click()}
      className={classNames(
        "flex cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed px-4 py-6 text-center transition-colors",
        dragging ? "border-indigo-400 bg-indigo-50/60" : "border-slate-200 bg-slate-50/60 hover:border-indigo-300",
      )}
    >
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        className="hidden"
        onChange={(e) => read(e.target.files?.[0])}
      />
      <Upload size={18} className="mb-2 text-slate-400" />
      <p className="text-sm font-medium text-slate-600">Drop a photo here, or click to browse</p>
      <p className="mt-0.5 text-xs text-slate-400">{hint}</p>
    </div>
  );
}

/* Signature element — Stripe's payment-lifecycle indicator, repurposed to
   track a laundry bag from Scheduled through to Delivered. */
function LaundryStepper({ current, timeline = {}, compact = false }) {
  const idx = STATUS_STEPS.indexOf(current);
  return (
    <div className="overflow-x-auto pb-1">
      <div className={classNames("flex items-start", compact ? "min-w-[520px]" : "min-w-[640px]")}>
        {STATUS_STEPS.map((step, i) => {
          const done = i < idx;
          const active = i === idx;
          const Icon = STEP_ICONS[step];
          return (
            <React.Fragment key={step}>
              <div className="flex flex-col items-center text-center" style={{ width: compact ? 78 : 96 }}>
                <div
                  className={classNames(
                    "flex items-center justify-center rounded-full border-2 transition-colors",
                    compact ? "h-7 w-7" : "h-9 w-9",
                    done && "border-indigo-600 bg-indigo-600 text-white",
                    active && "border-indigo-600 bg-white text-indigo-600 ring-4 ring-indigo-100",
                    !done && !active && "border-slate-200 bg-white text-slate-300",
                  )}
                >
                  {done ? <CheckCircle2 size={compact ? 14 : 17} /> : <Icon size={compact ? 13 : 16} />}
                </div>
                <span
                  className={classNames(
                    "mt-2 text-[11px] leading-tight",
                    active ? "font-semibold text-slate-900" : "text-slate-500",
                  )}
                >
                  {step}
                </span>
                {!compact && (
                  <span className="mt-0.5 text-[10px] text-slate-400">{timeline[step] || ""}</span>
                )}
              </div>
              {i < STATUS_STEPS.length - 1 && (
                <div
                  className={classNames("h-0.5 flex-1 rounded", i < idx ? "bg-indigo-600" : "bg-slate-200")}
                  style={{ marginTop: compact ? 13 : 17 }}
                />
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

      @keyframes modalIn { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
      @keyframes toastIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
      @keyframes sweep { 0% { top: 6%; } 50% { top: 90%; } 100% { top: 6%; } }
      @keyframes pulseRing { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

function NotificationBell({ audience }) {
  const { notifications, markAllRead } = useStore();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const mine = notifications.filter((n) => n.audience === audience);
  const unread = mine.filter((n) => !n.read).length;

  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [open]);

  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen((o) => !o)}
        className="relative flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition-colors hover:bg-slate-50"
        aria-label="Notifications"
      >
        <Bell size={16} />
        {unread > 0 && (
          <span className="absolute -right-0.5 -top-0.5 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-rose-600 px-1 text-[10px] font-semibold text-white">

              Mark all read

          <div className="max-h-80 overflow-y-auto">
            {mine.length === 0 && <EmptyState icon={Bell} title="No notifications yet" />}

        </div>
      )}
    </div>
  );
}

function useMyRecords() {
  const { records } = useStore();
  return useMemo(() => records.filter((r) => r.regNo === ME.regNo), [records]);
}

function ItemBreakdown({ items }) {
  const present = GARMENTS.filter((g) => Number(items?.[g.key]) > 0);
  if (!present.length) return <p className="text-sm text-slate-400">Not itemised yet — bag is still to be scanned.</p>;
  return (
    <div className="flex flex-wrap gap-2">
      {present.map((g) => (
        <span key={g.key} className="rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs text-slate-600">
          {g.label} <span className="font-semibold text-slate-900">× {items[g.key]}</span>
        </span>
      ))}
    </div>
  );
}

function DetailGrid({ rows }) {
  return (
    <dl className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
      {rows.map((r) => (
        <div key={r.label}>
          <dt className="text-xs text-slate-500">{r.label}</dt>
          <dd className="mt-1 text-sm font-medium text-slate-900">{r.value}</dd>
        </div>
      ))}
    </dl>
  );
}

function StudentPortal({ onExit }) {
  const [tab, setTab] = useState("overview");
  const { complaints } = useStore();
  const openCount = complaints.filter((c) => c.regNo === ME.regNo && c.status !== "Resolved").length;

  const navItems = [
    { key: "overview", label: "Overview", icon: LayoutGrid },
    { key: "track", label: "Track Laundry", icon: Activity },
    { key: "history", label: "History", icon: History },
    { key: "complaints", label: "Complaints", icon: MessageSquare, badge: openCount || null },
    { key: "lostfound", label: "Lost & Found", icon: Package },
    { key: "feedback", label: "Feedback", icon: Star },
  ];

  return (
    <Shell
      role="student"
      roleLabel="Student portal"
      userName={ME.name}
      initials="AM"
      navItems={navItems}
      active={tab}
      onNavigate={setTab}
      onExit={onExit}
    >
      {tab === "overview" && <StudentOverview go={setTab} />}
      {tab === "track" && <StudentTrack />}
      {tab === "history" && <StudentHistory />}
      {tab === "complaints" && <StudentComplaints />}
      {tab === "lostfound" && <StudentLostFound />}
      {tab === "feedback" && <StudentFeedback />}
    </Shell>
  );
}

function StudentOverview({ go }) {
  const { complaints, schedule, notifications } = useStore();
  const mine = useMyRecords();
  const active = mine.find((r) => r.status !== "Delivered") || mine[0];
  const openComplaints = complaints.filter((c) => c.regNo === ME.regNo && c.status !== "Resolved");
  const feed = notifications.filter((n) => n.audience === "student").slice(0, 5);

  const quick = [
    { label: "Raise complaint", icon: MessageSquare, tab: "complaints" },
    { label: "Give feedback", icon: Star, tab: "feedback" },
    { label: "Lost & Found", icon: Package, tab: "lostfound" },
    { label: "View history", icon: History, tab: "history" },
  ];

  return (
    <div className="space-y-6">
      <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <StatCard
          label="Next laundry day" value={schedule[ME.block]} sub={`${ME.block} · Room ${ME.room}`}
          icon={Calendar}
        />
        <StatCard
          label="Current status" value={active ? active.status : "No active bag"}
          sub={active ? `Record ${active.id}` : "Nothing in the wash"} icon={Clock} tint="amber"
        />
        <StatCard
          label="Open complaints" value={openComplaints.length}
          sub={openComplaints.length ? "Awaiting the hostel office" : "All clear"}
          icon={AlertCircle} tint={openComplaints.length ? "rose" : "emerald"}
        />
        <StatCard
          label="Cycles completed" value={mine.filter((r) => r.status === "Delivered").length}
          sub="This semester" icon={CheckCircle2} tint="emerald"
        />
      </div>

      {active ? (
        <Card className="p-5 sm:p-6">
          <SectionHeader
            title="Current laundry"
            subtitle={`${active.id} · submitted ${active.submittedAt} · ${active.itemCount} items · handled by ${active.staff}`}
            action={
              <Button variant="secondary" onClick={() => go("track")}>
                View details <ChevronRight size={15} />
              </Button>
            }
          />
          <LaundryStepper current={active.status} timeline={active.timeline} />
          {active.status === "Ready for Pickup" && active.otp && (
            <div className="mt-5 flex flex-wrap items-center gap-3 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3">
              <KeyRound size={16} className="text-emerald-600" />
              <p className="text-sm text-emerald-800">
                Ready for collection. Show this OTP at the counter:
                <span className="ml-2 font-mono text-base font-semibold tracking-[0.2em]">{active.otp}</span>
              </p>
            </div>
          )}
        </Card>
      ) : (
        <Card><EmptyState icon={Shirt} title="No active laundry" hint="Your next scheduled pickup is shown above." /></Card>
      )}

      <div className="grid gap-4 lg:grid-cols-2">
        <Card className="p-5">
          <p className="text-sm font-semibold text-slate-900">Quick actions</p>
          <div className="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
            {quick.map((q) => (
              <Button key={q.label} variant="secondary" className="justify-start" onClick={() => go(q.tab)}>
                <q.icon size={15} className="text-slate-400" /> {q.label}
              </Button>
            ))}
          </div>
        </Card>

        <Card className="p-5">
          <p className="text-sm font-semibold text-slate-900">Recent notifications</p>
          <ul className="mt-3 space-y-3">
            {feed.length === 0 && <li className="text-sm text-slate-400">Nothing new.</li>}
            {feed.map((n) => (
              <li key={n.id} className="flex gap-2.5">
                <span className={classNames("mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full", n.read ? "bg-slate-300" : "bg-indigo-500")} />
                <div>
                  <p className="text-sm leading-snug text-slate-600">{n.text}</p>
                  <p className="text-xs text-slate-400">{n.at}</p>
                </div>
              </li>
            ))}
          </ul>
        </Card>
      </div>
    </div>
  );
}

function StudentTrack() {
  const mine = useMyRecords();
  const [selectedId, setSelectedId] = useState(null);
  const [query, setQuery] = useState("");
  const [status, setStatus] = useState("all");

  const active = mine.find((r) => r.id === selectedId)
    || mine.find((r) => r.status !== "Delivered")
    || mine[0];

  const rows = mine.filter((r) => {
    const q = query.trim().toLowerCase();
    const matchQ = !q || r.id.toLowerCase().includes(q) || r.status.toLowerCase().includes(q) || String(r.staff).toLowerCase().includes(q);
    const matchS = status === "all" || r.status === status;
    return matchQ && matchS;
  });

  return (
    <div className="space-y-6">
      {active && (
        <Card className="p-5 sm:p-6">
          <SectionHeader
            title={`Record ${active.id}`}
            subtitle={`Submitted ${active.submittedAt} · ${ME.block}, Room ${ME.room}`}
            action={<StatusPill status={active.status} />}
          />
          <LaundryStepper current={active.status} timeline={active.timeline} />

          <div className="mt-6 border-t border-slate-100 pt-5">
            <DetailGrid
              rows={[
                { label: "Handled by", value: active.staff },
                { label: "Items", value: `${active.itemCount} pieces` },
                { label: "Weight", value: `${active.weightKg} kg` },
                { label: "Pickup OTP", value: active.otp ? <span className="font-mono tracking-widest">{active.otp}</span> : "Issued when ready" },
              ]}
            />
            <div className="mt-5">
              <p className="mb-2 text-xs text-slate-500">Itemised breakdown</p>
              <ItemBreakdown items={active.items} />
            </div>
            {active.remarks && (
              <p className="mt-4 rounded-lg bg-slate-50 px-3 py-2 text-sm text-slate-600">
                <span className="font-medium text-slate-800">Remarks:</span> {active.remarks}
              </p>
            )}
          </div>
        </Card>
      )}

      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="All my records"
          subtitle="Select any row to load it into the tracker above."
          action={
            <div className="flex flex-wrap gap-2">
              <SearchBar value={query} onChange={setQuery} placeholder="Search record or staff" className="w-full sm:w-56" />
              <FilterDropdown value={status} onChange={setStatus} options={STATUS_STEPS} label="All statuses" />
            </div>
          }
        />
        <Table
          columns={[
            { key: "id", label: "Record" },
            { key: "submittedAt", label: "Submitted" },
            { key: "itemCount", label: "Items" },
            { key: "weightKg", label: "Weight" },
            { key: "staff", label: "Handler" },
            { key: "status", label: "Status" },
            { key: "action", label: "", align: "right" },
          ]}
          rows={rows}
          empty="No records match this filter."
          render={(r, key) => {
            if (key === "id") return <span className="font-medium text-slate-900">{r.id}</span>;
            if (key === "weightKg") return `${r.weightKg} kg`;
            if (key === "status") return <StatusPill status={r.status} />;
            if (key === "action") {
              return (
                <Button variant="ghost" size="sm" onClick={() => setSelectedId(r.id)}>
                  Track <ChevronRight size={13} />
                </Button>
              );
            }
            return r[key];
          }}
        />
      </Card>
    </div>
  );
}

function StudentHistory() {
  const mine = useMyRecords();
  const [receipt, setReceipt] = useState(null);
  const [query, setQuery] = useState("");
  const history = mine.filter((r) => r.status === "Delivered");
  const rows = history.filter((r) => !query.trim() || r.id.toLowerCase().includes(query.trim().toLowerCase()));

  const totalItems = history.reduce((t, r) => t + r.itemCount, 0);
  const totalWeight = history.reduce((t, r) => t + r.weightKg, 0).toFixed(1);

  return (
    <div className="space-y-6">
      <div className="grid gap-4 sm:grid-cols-3">
        <StatCard label="Completed cycles" value={history.length} sub="Delivered and closed" icon={CheckCircle2} tint="emerald" />
        <StatCard label="Pieces washed" value={totalItems} sub="Across all cycles" icon={Layers} />
        <StatCard label="Total weight" value={`${totalWeight} kg`} sub="Billed by weight slab" icon={Gauge} tint="slate" />
      </div>

      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="Laundry history"
          subtitle="Every completed cycle, with the OTP used at handover."
          action={<SearchBar value={query} onChange={setQuery} placeholder="Search by record id" className="w-full sm:w-60" />}
        />
        <Table
          columns={[
            { key: "id", label: "Record" },
            { key: "submittedAt", label: "Submitted" },
            { key: "deliveredAt", label: "Delivered" },
            { key: "itemCount", label: "Items" },
            { key: "otp", label: "Pickup OTP" },
            { key: "action", label: "", align: "right" },
          ]}
          rows={rows}
          empty="No completed cycles yet."
          render={(r, key) => {
            if (key === "id") return <span className="font-medium text-slate-900">{r.id}</span>;
            if (key === "otp") return <span className="font-mono text-xs tracking-widest text-slate-500">{r.otp || "—"}</span>;
            if (key === "action") {
              return <Button variant="secondary" size="sm" onClick={() => setReceipt(r)}><FileText size={13} /> Receipt</Button>;
            }
            return r[key] ?? "—";
          }}
        />
      </Card>

      <Modal
        open={!!receipt}
        onClose={() => setReceipt(null)}
        title={receipt ? `Digital receipt · ${receipt.id}` : ""}
        subtitle="Frontend-generated summary — no billing backend is connected."
        footer={<Button variant="secondary" onClick={() => setReceipt(null)}>Close</Button>}
      >
        {receipt && (
          <div className="space-y-5">
            <div className="rounded-lg border border-slate-200 bg-slate-50 p-4">
              <DetailGrid
                rows={[
                  { label: "Student", value: `${ME.name} (${ME.regNo})` },
                  { label: "Block / Room", value: `${ME.block} · ${ME.room}` },
                  { label: "Submitted", value: receipt.submittedAt },

function StudentComplaints() {
  const { complaints, raiseComplaint } = useStore();
  const mine = useMyRecords();
  const [filter, setFilter] = useState("all");
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ recordId: "", category: COMPLAINT_CATEGORIES[0], subject: "", description: "", photo: null });
  const [errors, setErrors] = useState({});

  const list = complaints
    .filter((c) => c.regNo === ME.regNo)
    .filter((c) => filter === "all" || c.status === filter);

  const reset = () => {
    setForm({ recordId: mine[0]?.id || "", category: COMPLAINT_CATEGORIES[0], subject: "", description: "", photo: null });
    setErrors({});
  };

  const submit = () => {
    const next = {};
    if (!form.recordId) next.recordId = "Choose the laundry record this is about.";
    if (!form.subject.trim()) next.subject = "Add a short subject line.";
    if (form.description.trim().length < 12) next.description = "Give the office a little more detail (12+ characters).";
    setErrors(next);
    if (Object.keys(next).length) return;
    raiseComplaint({ ...form, photo: form.photo?.dataUrl || null });
    setOpen(false);
    reset();
  };

  return (
    <div className="space-y-6">
      <div className="grid gap-4 sm:grid-cols-3">
        {["Open", "Under Review", "Resolved"].map((s, i) => (
          <StatCard
            key={s}
            label={s}
            value={complaints.filter((c) => c.regNo === ME.regNo && c.status === s).length}
            sub={s === "Resolved" ? "Closed by the office" : "Awaiting action"}
            icon={[AlertCircle, Timer, CheckCircle2][i]}
            tint={["rose", "amber", "emerald"][i]}
          />
        ))}
      </div>

      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="My complaints"
          subtitle="Raised against a specific laundry record, with optional photo evidence."
          action={
            <div className="flex flex-wrap gap-2">
              <FilterDropdown value={filter} onChange={setFilter} options={["Open", "Under Review", "Resolved"]} label="All statuses" />
              <Button onClick={() => { reset(); setOpen(true); }}><Plus size={15} /> Raise complaint</Button>
            </div>
          }
        />
        <Table
          columns={[
            { key: "id", label: "Ticket" },
            { key: "recordId", label: "Record" },
            { key: "category", label: "Category" },
            { key: "subject", label: "Subject" },
            { key: "createdAt", label: "Raised" },
            { key: "status", label: "Status" },
          ]}
          rows={list}
          empty="No complaints raised."
          render={(c, key) => {
            if (key === "id") return <span className="font-medium text-slate-900">{c.id}</span>;
            if (key === "status") return <StatusPill status={c.status} />;
            if (key === "subject") {
              return (
                <div className="max-w-xs">
                  <p className="truncate text-slate-800">{c.subject}</p>
                  {c.photo && <span className="mt-0.5 inline-flex items-center gap-1 text-[11px] text-slate-400"><Camera size={11} /> photo attached</span>}
                  {c.status === "Resolved" && c.resolution && (
                    <p className="mt-1 truncate text-xs text-emerald-600">Resolved: {c.resolution}</p>
                  )}
                </div>
              );
            }
            return c[key];
          }}
        />
      </Card>

      <Modal
        open={open}
        onClose={() => setOpen(false)}
        title="Raise a complaint"
        subtitle="Goes straight to the hostel office queue in the Admin portal."

        footer={
          <>
            <Button variant="secondary" onClick={() => setOpen(false)}>Cancel</Button>
            <Button onClick={submit}><Send size={15} /> Submit complaint</Button>
          </>
        }
      >
        <div className="space-y-4">
          <div className="grid gap-4 sm:grid-cols-2">
            <Field label="Laundry record" error={errors.recordId}>
              <Select
                value={form.recordId}
                onChange={(e) => setForm({ ...form, recordId: e.target.value })}
                options={[{ value: "", label: "Select a record…" }, ...mine.map((r) => ({ value: r.id, label: `${r.id} · ${r.submittedAt} · ${r.itemCount} items` }))]}
              />
            </Field>
            <Field label="Category">
              <Select
                value={form.category}
                onChange={(e) => setForm({ ...form, category: e.target.value })}
                options={COMPLAINT_CATEGORIES}

            />

          <Field label="What happened?" error={errors.description}>
            <Textarea
              rows={4}
              value={form.description}
              onChange={(e) => setForm({ ...form, description: e.target.value })}
              placeholder="Describe the item, when you noticed, and anything the staff should check."
            />
          </Field>
          <Field label="Photo evidence (optional)">
            <PhotoPicker value={form.photo} onChange={(p) => setForm({ ...form, photo: p })} />
          </Field>
        </div>
      </Modal>
    </div>
  );
}

function StudentLostFound() {
  const { lostItems, claimLostItem } = useStore();
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("all");
  const [claiming, setClaiming] = useState(null);
  const [proof, setProof] = useState("");
  const [error, setError] = useState("");

  const list = lostItems.filter((i) => {
    const q = query.trim().toLowerCase();
    const matchQ = !q || i.description.toLowerCase().includes(q) || i.color.toLowerCase().includes(q);
    return matchQ && (category === "all" || i.category === category);
  });

  const submitClaim = () => {
    if (proof.trim().length < 10) { setError("Describe a detail only the owner would know (10+ characters)."); return; }
    claimLostItem(claiming.id, proof.trim());
    setClaiming(null);
    setProof("");
    setError("");
  };

  return (
    <div className="space-y-6">
      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="Lost & Found board"

          action={
            <div className="flex flex-wrap gap-2">
              <SearchBar value={query} onChange={setQuery} placeholder="Search item or colour" className="w-full sm:w-56" />

              <Card key={item.id} className="overflow-hidden">
                <div className="flex h-32 items-center justify-center border-b border-slate-100 bg-slate-50">
                  {item.photo
                    ? <img src={item.photo} alt={item.description} className="h-full w-full object-cover" />
                    : <Package size={26} className="text-slate-300" />}
                </div>
                <div className="p-4">
                  <div className="flex items-start justify-between gap-2">
                    <p className="text-sm font-semibold text-slate-900">{item.id}</p>

                  </div>
                  <p className="mt-1.5 text-sm leading-snug text-slate-600">{item.description}</p>
                  <div className="mt-3 flex flex-wrap gap-1.5">
                    <span className="rounded-md bg-indigo-50 px-2 py-0.5 text-[11px] font-medium text-indigo-700">{item.category}</span>
                    <span className="rounded-md bg-slate-100 px-2 py-0.5 text-[11px] text-slate-600">{item.color}</span>

                  <p className="mt-3 flex items-center gap-1.5 text-xs text-slate-400">
                    <MapPin size={12} /> {item.foundPlace} · {item.foundAt}
                  </p>
                  <div className="mt-4">
                    {item.status === "Available" && (
                      <Button size="sm" className="w-full" onClick={() => { setClaiming(item); setProof(""); setError(""); }}>

function StudentFeedback() {
  const { feedback, submitFeedback } = useStore();
  const mine = useMyRecords().filter((r) => r.status === "Delivered");
  const rated = new Set(feedback.filter((f) => f.regNo === ME.regNo).map((f) => f.recordId));
  const [form, setForm] = useState({ recordId: "", overall: 0, cleanliness: 0, speed: 0, care: 0, note: "" });
  const [error, setError] = useState("");

  useEffect(() => {
    if (!form.recordId) {
      const next = mine.find((r) => !rated.has(r.id)) || mine[0];
      if (next) setForm((f) => ({ ...f, recordId: next.id }));
    }
  }, [mine, form.recordId, rated]);

  const myFeedback = feedback.filter((f) => f.regNo === ME.regNo);
  const avg = myFeedback.length ? (myFeedback.reduce((t, f) => t + f.overall, 0) / myFeedback.length).toFixed(1) : "—";

  const submit = () => {
    if (!form.recordId) { setError("Pick the delivery you are rating."); return; }
    if (!form.overall) { setError("Give an overall star rating."); return; }
    setError("");
    submitFeedback({ ...form });
    setForm({ recordId: "", overall: 0, cleanliness: 0, speed: 0, care: 0, note: "" });
  };

  return (
    <div className="space-y-6">
      <div className="grid gap-4 sm:grid-cols-3">
        <StatCard label="Ratings submitted" value={myFeedback.length} sub="Across delivered cycles" icon={ThumbsUp} />
        <StatCard label="Your average" value={`${avg} / 5`} sub="Overall service score" icon={Star} tint="amber" />
        <StatCard label="Awaiting rating" value={mine.filter((r) => !rated.has(r.id)).length} sub="Delivered but unrated" icon={Timer} tint="slate" />
      </div>

      <div className="grid gap-6 lg:grid-cols-5">
        <Card className="p-5 sm:p-6 lg:col-span-3">
          <SectionHeader title="Rate a delivery" subtitle="Ratings feed the average service score on the admin dashboard." />
          <div className="space-y-5">
            <Field label="Delivered record">
              <Select
                value={form.recordId}
                onChange={(e) => setForm({ ...form, recordId: e.target.value })}
                options={mine.length
                  ? mine.map((r) => ({ value: r.id, label: `${r.id} · delivered ${r.deliveredAt}${rated.has(r.id) ? " (already rated)" : ""}` }))
                  : [{ value: "", label: "No delivered records yet" }]}
              />
            </Field>

            <div className="rounded-lg border border-slate-200 p-4">
              <p className="text-xs font-medium text-slate-600">Overall experience</p>
              <div className="mt-2 flex items-center gap-3">
                <StarRating value={form.overall} onChange={(v) => setForm({ ...form, overall: v })} />
                <span className="text-sm text-slate-500">{form.overall ? `${form.overall} / 5` : "Tap to rate"}</span>
              </div>
            </div>

            <div className="grid gap-3">
              {FEEDBACK_DIMENSIONS.map((d) => (
                <div key={d.key} className="flex flex-wrap items-center justify-between gap-2 rounded-lg border border-slate-200 px-4 py-3">
                  <div>
                    <p className="text-sm font-medium text-slate-800">{d.label}</p>
                    <p className="text-xs text-slate-400">{d.hint}</p>
                  </div>
                  <StarRating size={18} value={form[d.key]} onChange={(v) => setForm({ ...form, [d.key]: v })} />
                </div>
              ))}
            </div>

            <Field label="Anything else? (optional)" error={error}>
              <Textarea rows={3} value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="Tell the laundry team what went well or what to fix." />
            </Field>

            <Button onClick={submit} disabled={!mine.length}><Send size={15} /> Submit rating</Button>
          </div>
        </Card>

        <Card className="p-5 sm:p-6 lg:col-span-2">
          <SectionHeader title="Your past ratings" />
          {myFeedback.length === 0 ? (
            <EmptyState icon={Star} title="No ratings yet" hint="Rate a delivered cycle to see it here." />
          ) : (
            <ul className="space-y-3">
              {myFeedback.map((f) => (
                <li key={f.id} className="rounded-lg border border-slate-200 p-4">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium text-slate-900">{f.recordId}</span>
                    <StarRating value={f.overall} size={14} readOnly onChange={() => {}} />
                  </div>
                  {f.note && <p className="mt-2 text-sm text-slate-600">{f.note}</p>}
                  <p className="mt-2 text-xs text-slate-400">
                    Cleanliness {f.cleanliness} · Speed {f.speed} · Care {f.care} · {f.at}
                  </p>
                </li>
              ))}
            </ul>
          )}
        </Card>
      </div>
    </div>
  );
}

  const [items, setItems] = useState(EMPTY_ITEMS);
  const [remarks, setRemarks] = useState("");
  const [error, setError] = useState("");
  const timer = useRef(null);

  useEffect(() => () => clearTimeout(timer.current), []);

  const startScan = () => {
    setScanned(null);
    setScanning(true);
    setError("");
    timer.current = setTimeout(() => {
      setScanning(false);
      setScanned(SCANNABLE.find((s) => s.regNo === target));
      setItems(EMPTY_ITEMS);
      setRemarks("");
    }, 1600);
  };

  const total = countItems(items);
  const weight = weighItems(items);

  const submit = () => {
    if (!total) { setError("Count at least one garment before submitting the bag."); return; }
    setError("");
    submitLaundry({ ...scanned, items, remarks, staff: STAFF.name });

    setItems(EMPTY_ITEMS);
    setRemarks("");

  return (

          <Button className="w-full" onClick={startScan} disabled={scanning}>

          </Button>
          {scanned && (

              <RefreshCw size={15} /> Reset reader

        </div>
      </Card>

      <Card className="p-5 sm:p-6 lg:col-span-3">
        {!scanned ? (
          <EmptyState

        ) : (
          <>

            <div className="rounded-lg border border-slate-200 bg-slate-50 p-4">
              <DetailGrid

                  { label: "Room", value: scanned.room },

            </div>

            <div className="mt-5">
              <p className="mb-2 text-xs font-medium text-slate-600">Itemised count</p>
              <div className="space-y-2">
                {GARMENTS.map((g) => (
                  <div key={g.key} className="flex items-center justify-between rounded-lg border border-slate-200 px-4 py-2.5">
                    <div>
                      <p className="text-sm text-slate-800">{g.label}</p>
                      <p className="text-[11px] text-slate-400">{g.weight} kg each</p>

                    <div className="flex items-center gap-2">
                      <Button
                        variant="secondary" size="sm"
                        onClick={() => setItems((it) => ({ ...it, [g.key]: Math.max(0, it[g.key] - 1) }))}

                        −

function OtpInput({ value, onChange, disabled }) {
  const refs = useRef([]);

  const setDigit = (i, digit) => {
    const next = value.split("");
    next[i] = digit;
    onChange(next.join("").slice(0, 6));
    if (digit && i < 5) refs.current[i + 1]?.focus();
  };

  return (
    <div className="flex gap-2">
      {[0, 1, 2, 3, 4, 5].map((i) => (
        <input
          key={i}
          ref={(el) => { refs.current[i] = el; }}
          value={value[i] || ""}
          disabled={disabled}
          inputMode="numeric"
          maxLength={1}
          onChange={(e) => setDigit(i, e.target.value.replace(/\D/g, ""))}
          onKeyDown={(e) => {
            if (e.key === "Backspace" && !value[i] && i > 0) refs.current[i - 1]?.focus();
          }}
          onPaste={(e) => {
            e.preventDefault();
            const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
            if (text) { onChange(text); refs.current[Math.min(text.length, 5)]?.focus(); }
          }}
          className="h-12 w-11 rounded-lg border border-slate-200 text-center font-mono text-lg font-semibold text-slate-900 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 disabled:bg-slate-50"
        />
      ))}
    </div>
  );
}

function StaffDeliver() {
  const { records, verifyOtp } = useStore();
  const ready = records.filter((r) => r.status === "Ready for Pickup");
  const [selected, setSelected] = useState("");
  const [code, setCode] = useState("");
  const [result, setResult] = useState(null);

  useEffect(() => {
    if (selected && !ready.some((r) => r.id === selected)) { setSelected(""); setCode(""); }
  }, [ready, selected]);

  const record = ready.find((r) => r.id === selected);

  const verify = () => {
    if (!selected) { setResult({ ok: false, reason: "Select the laundry record being handed over." }); return; }
    if (code.length !== 6) { setResult({ ok: false, reason: "Enter all six digits of the pickup OTP." }); return; }
    const outcome = verifyOtp(selected, code);
    setResult(outcome);
    if (outcome.ok) { setCode(""); setSelected(""); }
  };

  return (
    <div className="grid gap-6 lg:grid-cols-5">
      <Card className="p-5 sm:p-6 lg:col-span-3">
        <SectionHeader
          title="Verify pickup OTP"
          subtitle="The student reads out the six-digit code from their portal. Delivery is only recorded on a match."
        />

        <div className="space-y-5">
          <Field label="Laundry record" hint="Only bags marked Ready for Pickup can be handed over.">
            <Select
              value={selected}
              onChange={(e) => { setSelected(e.target.value); setResult(null); setCode(""); }}
              options={[
                { value: "", label: ready.length ? "Select a record…" : "No bags are ready for pickup" },
                ...ready.map((r) => ({ value: r.id, label: `${r.id} — ${r.student} (${r.room})` })),
              ]}
            />
          </Field>

          {record && (
            <div className="rounded-lg border border-slate-200 bg-slate-50 p-4">
              <DetailGrid
                rows={[
                  { label: "Student", value: record.student },
                  { label: "Reg. no.", value: record.regNo },
                  { label: "Items", value: `${record.itemCount} pieces` },
                  { label: "Ready since", value: record.timeline["Ready for Pickup"] || "—" },
                ]}
              />
            </div>
          )}

          <div>
            <p className="mb-2 text-xs font-medium text-slate-600">Pickup OTP</p>
            <OtpInput value={code} onChange={(v) => { setCode(v); setResult(null); }} disabled={!selected} />
          </div>

          <div className="flex flex-wrap gap-2">
            <Button onClick={verify}><ShieldCheck size={15} /> Verify & complete handover</Button>
            <Button variant="secondary" onClick={() => { setCode(""); setResult(null); }}>Clear</Button>
          </div>

          {result && !result.ok && (
            <div className="flex items-start gap-3 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3">
              <XCircle size={17} className="mt-0.5 shrink-0 text-rose-600" />
              <p className="text-sm text-rose-800">{result.reason}</p>
            </div>
          )}

          {result && result.ok && (
            <div className="space-y-3">
              <div className="flex items-start gap-3 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3">
                <CheckCircle2 size={17} className="mt-0.5 shrink-0 text-emerald-600" />
                <div>
                  <p className="text-sm font-medium text-emerald-900">
                    {result.record.id} handed over to {result.record.student}.
                  </p>
                  <p className="text-xs text-emerald-700">Status moved to Delivered and the cycle is closed.</p>
                </div>
              </div>
              <div className="flex items-start gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3">
                <Mail size={17} className="mt-0.5 shrink-0 text-indigo-600" />
                <div>
                  <p className="text-sm font-medium text-slate-900">Pickup confirmation email sent</p>
                  <p className="text-xs text-slate-500">
                    Simulated delivery to {result.record.student} — the email notification service is not wired up in this prototype.
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      </Card>

      <Card className="p-5 sm:p-6 lg:col-span-2">
        <SectionHeader title="Awaiting handover" subtitle={`${ready.length} bag${ready.length === 1 ? "" : "s"} ready at the counter`} />

          <EmptyState icon={Package} title="Nothing waiting" hint="Bags appear here once they reach Ready for Pickup." />

          <ul className="space-y-2">
            {ready.map((r) => (
              <li key={r.id}>
                <button
                  onClick={() => { setSelected(r.id); setResult(null); setCode(""); }}
                  className={classNames(
                    "flex w-full items-center justify-between rounded-lg border px-4 py-3 text-left transition-colors",
                    selected === r.id ? "border-indigo-300 bg-indigo-50" : "border-slate-200 hover:bg-slate-50",

                    <p className="text-sm font-medium text-slate-900">{r.student}</p>
                    <p className="text-xs text-slate-400">{r.id} · {r.room} · {r.itemCount} items</p>
                  </div>
                  <ChevronRight size={15} className="text-slate-300" />
                </button>
              </li>
            ))}

        )}

  );
}

    const matchQ = !q || u.name.toLowerCase().includes(q) || u.identifier.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
    return matchQ && (role === "all" || u.role === role);
  });

  const submit = () => {
    const next = {};
    if (!form.name.trim()) next.name = "Name is required.";
    if (!form.identifier.trim()) next.identifier = form.role === "Student" ? "Registration number is required." : "Staff ID is required.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) next.email = "Enter a valid email address.";
    if (!form.detail.trim()) next.detail = form.role === "Student" ? "Room number is required." : "Shift is required.";
    setErrors(next);
    if (Object.keys(next).length) return;
    addUser({ ...form, name: form.name.trim(), identifier: form.identifier.trim().toUpperCase(), email: form.email.trim() });
    setForm(blank);
    setErrors({});
    setOpen(false);
  };

  return (
    <div className="space-y-6">
      <div className="grid gap-4 sm:grid-cols-3">
        <StatCard label="Students" value={users.filter((u) => u.role === "Student").length} sub="Registered residents" icon={Users} />
        <StatCard label="Laundry staff" value={users.filter((u) => u.role === "Staff").length} sub="Counter operators" icon={ClipboardList} tint="slate" />
        <StatCard label="Suspended" value={users.filter((u) => u.status === "Suspended").length} sub="No portal access" icon={Ban} tint="rose" />
      </div>

      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="User accounts"
          subtitle="Students and laundry staff registered on the system."
          action={
            <div className="flex flex-wrap gap-2">
              <SearchBar value={query} onChange={setQuery} placeholder="Search name, ID or email" className="w-full sm:w-60" />
              <FilterDropdown value={role} onChange={setRole} options={["Student", "Staff"]} label="All roles" />
              <Button onClick={() => setOpen(true)}><UserPlus size={15} /> Add user</Button>
            </div>
          }
        />
        <Table
          columns={[
            { key: "name", label: "Name" },
            { key: "role", label: "Role" },
            { key: "identifier", label: "Reg / Staff ID" },
            { key: "block", label: "Block" },
            { key: "detail", label: "Room / Shift" },
            { key: "status", label: "Status" },
            { key: "action", label: "", align: "right" },
          ]}
          rows={rows}
          empty="No accounts match this filter."
          render={(u, key) => {
            if (key === "name") {
              return (
                <div>
                  <p className="font-medium text-slate-900">{u.name}</p>
                  <p className="text-xs text-slate-400">{u.email}</p>
                </div>
              );
            }
            if (key === "role") return <StatusPill status={u.role} />;
            if (key === "status") return <StatusPill status={u.status} />;
            if (key === "action") {
              return (
                <div className="flex justify-end gap-1.5">
                  <Button size="sm" variant="secondary" onClick={() => toggleUser(u.id)}>
                    {u.status === "Active" ? <><Ban size={13} /> Suspend</> : <><Check size={13} /> Activate</>}
                  </Button>
                  <Button size="sm" variant="danger" onClick={() => removeUser(u.id)}><Trash2 size={13} /></Button>
                </div>
              );
            }
            return u[key];
          }}
        />
      </Card>

      <Modal
        open={open}
        onClose={() => setOpen(false)}
        title="Add a new user"
        subtitle="Creates a local account record — no auth provider is connected."
        width="max-w-xl"
        footer={
          <>
            <Button variant="secondary" onClick={() => setOpen(false)}>Cancel</Button>
            <Button onClick={submit}><UserPlus size={15} /> Create account</Button>
          </>
        }
      >
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Role">
            <Select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} options={["Student", "Staff"]} />
          </Field>
          <Field label="Full name" error={errors.name}>
            <Input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="e.g. Ananya Iyer" />
          </Field>
          <Field label={form.role === "Student" ? "Registration number" : "Staff ID"} error={errors.identifier}>
            <Input
              value={form.identifier}
              onChange={(e) => setForm({ ...form, identifier: e.target.value })}
              placeholder={form.role === "Student" ? "23BCE1234" : "STF-120"}
            />
          </Field>
          <Field label="Block">
            <Select value={form.block} onChange={(e) => setForm({ ...form, block: e.target.value })} options={BLOCKS} />
          </Field>
          <Field label={form.role === "Student" ? "Room number" : "Shift"} error={errors.detail}>
            <Input
              value={form.detail}
              onChange={(e) => setForm({ ...form, detail: e.target.value })}
              placeholder={form.role === "Student" ? "C-118" : "Morning shift"}
            />
          </Field>
          <Field label="Email" error={errors.email} className="sm:col-span-2">
            <Input value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="name@hostel.edu" />

        </div>

    </div>
  );
}

function AdminSchedule() {
  const { schedule, blackouts, users, reassignBlock, addBlackout, removeBlackout } = useStore();
  const [editing, setEditing] = useState(null);
  const [day, setDay] = useState(WEEKDAYS[0]);
  const [blackout, setBlackout] = useState({ date: "", reason: "" });
  const [error, setError] = useState("");

  const affected = (block) => users.filter((u) => u.role === "Student" && u.block === block).length;

  const save = () => {
    reassignBlock(editing, day);
    setEditing(null);
  };

  const submitBlackout = () => {
    if (!blackout.date.trim() || !blackout.reason.trim()) { setError("Both a date and a reason are needed."); return; }
    addBlackout(blackout.date.trim(), blackout.reason.trim());
    setBlackout({ date: "", reason: "" });
    setError("");
  };

  return (
    <div className="space-y-6">
      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="Block laundry days"
          subtitle="One collection day per block. Reassigning notifies students and staff immediately."
        />
        <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
          {BLOCKS.map((block) => (
            <Card key={block} className="p-5">
              <div className="flex items-start justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
                    <Building2 size={17} />
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-900">{block}</p>
                    <p className="text-xs text-slate-400">{affected(block)} students</p>
                  </div>
                </div>
                <span className="rounded-lg bg-slate-900 px-2.5 py-1 text-xs font-semibold text-white">
                  {schedule[block]}
                </span>
              </div>
              <div className="mt-4 flex gap-1.5">
                {WEEKDAYS.map((d) => (
                  <span
                    key={d}
                    className={classNames(
                      "flex-1 rounded-md py-1 text-center text-[11px] font-medium",
                      schedule[block] === d ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-400",

        <div className="grid gap-6 lg:grid-cols-5">

            {blackouts.length === 0 ? (
              <EmptyState icon={CalendarDays} title="No blackout dates" hint="Add one when a machine is down or the hostel is closed." />
            ) : (
              <ul className="space-y-2">

                  <li key={b.id} className="flex items-center justify-between rounded-lg border border-slate-200 px-4 py-3">
                    <div className="flex items-center gap-3">
                      <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-rose-50 text-rose-600">
                        <CalendarDays size={16} />
                      </div>
                      <div>
                        <p className="text-sm font-medium text-slate-900">{b.date}</p>
                        <p className="text-xs text-slate-500">{b.reason}</p>

function AdminComplaints() {
  const { complaints, resolveComplaint, updateComplaintStatus } = useStore();
  const [filter, setFilter] = useState("all");
  const [query, setQuery] = useState("");
  const [review, setReview] = useState(null);
  const [note, setNote] = useState("");
  const [error, setError] = useState("");

  const rows = complaints
    .filter((c) => filter === "all" || c.status === filter)
    .filter((c) => {
      const q = query.trim().toLowerCase();
      return !q || c.id.toLowerCase().includes(q) || c.student.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q);
    });

  const openReview = (c) => { setReview(c); setNote(c.resolution || ""); setError(""); };

  const resolve = () => {
    if (note.trim().length < 8) { setError("Add a short resolution note for the student."); return; }
    resolveComplaint(review.id, note.trim());
    setReview(null);
  };

  return (
    <div className="space-y-6">
      <div className="grid gap-4 sm:grid-cols-3">
        {["Open", "Under Review", "Resolved"].map((s, i) => (
          <StatCard
            key={s} label={s} value={complaints.filter((c) => c.status === s).length}
            sub={s === "Resolved" ? "Closed tickets" : "Needs the office"}
            icon={[AlertCircle, Timer, CheckCircle2][i]} tint={["rose", "amber", "emerald"][i]}
          />
        ))}
      </div>

      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="Complaint queue"
          subtitle="Every ticket raised across all blocks, newest first."
          action={
            <div className="flex flex-wrap gap-2">
              <SearchBar value={query} onChange={setQuery} placeholder="Search ticket, student or subject" className="w-full sm:w-64" />
              <FilterDropdown value={filter} onChange={setFilter} options={["Open", "Under Review", "Resolved"]} label="All statuses" />
            </div>
          }
        />
        <Table
          columns={[
            { key: "id", label: "Ticket" },
            { key: "student", label: "Student" },
            { key: "recordId", label: "Record" },
            { key: "category", label: "Category" },
            { key: "createdAt", label: "Raised" },
            { key: "status", label: "Status" },
            { key: "action", label: "", align: "right" },
          ]}
          rows={rows}
          empty="No complaints match this filter."
          render={(c, key) => {
            if (key === "id") {
              return (
                <div>
                  <p className="font-medium text-slate-900">{c.id}</p>
                  <p className="max-w-[180px] truncate text-xs text-slate-400">{c.subject}</p>
                </div>
              );
            }
            if (key === "student") {
              return (
                <div>
                  <p className="text-slate-900">{c.student}</p>
                  <p className="text-xs text-slate-400">{c.regNo}</p>
                </div>
              );
            }
            if (key === "status") return <StatusPill status={c.status} />;
            if (key === "action") {
              return (
                <div className="flex justify-end gap-1.5">
                  {c.status === "Open" && (
                    <Button size="sm" variant="secondary" onClick={() => updateComplaintStatus(c.id, "Under Review")}>
                      <Search size={13} /> Start review
                    </Button>
                  )}
                  <Button size="sm" variant={c.status === "Resolved" ? "ghost" : "primary"} onClick={() => openReview(c)}>
                    {c.status === "Resolved" ? "View" : "Review & resolve"}
                  </Button>
                </div>
              );
            }
            return c[key];
          }}
        />
      </Card>

      <Modal
        open={!!review}
        onClose={() => setReview(null)}
        title={review ? `${review.id} · ${review.category}` : ""}
        subtitle={review ? `Raised by ${review.student} (${review.regNo}) on ${review.createdAt}` : ""}
        width="max-w-2xl"
        footer={
          review?.status === "Resolved" ? (
            <Button variant="secondary" onClick={() => setReview(null)}>Close</Button>
          ) : (
            <>
              <Button variant="secondary" onClick={() => setReview(null)}>Cancel</Button>
              <Button variant="success" onClick={resolve}><CheckCircle2 size={15} /> Mark resolved</Button>
            </>
          )
        }
      >
        {review && (
          <div className="space-y-5">
            <div className="rounded-lg border border-slate-200 bg-slate-50 p-4">
              <DetailGrid
                rows={[
                  { label: "Laundry record", value: review.recordId },
                  { label: "Handled by", value: review.handler },
                  { label: "Category", value: review.category },
                  { label: "Status", value: <StatusPill status={review.status} /> },
                ]}
              />
            </div>

            <div>
              <p className="text-xs font-medium text-slate-600">Student description</p>
              <p className="mt-1.5 rounded-lg border border-slate-200 px-4 py-3 text-sm leading-relaxed text-slate-700">
                {review.description}
              </p>
            </div>

            <div>
              <p className="mb-1.5 text-xs font-medium text-slate-600">Photo evidence</p>
              {review.photo ? (
                <img src={review.photo} alt="Complaint evidence" className="max-h-64 rounded-lg border border-slate-200 object-contain" />

                <p className="rounded-lg border border-dashed border-slate-200 px-4 py-6 text-center text-xs text-slate-400">

            {review.status === "Resolved" && review.resolvedAt && (
              <p className="text-xs text-emerald-600">Resolved on {review.resolvedAt}.</p>
            )}
          </div>
        )}
      </Modal>
    </div>
  );
}

function AdminReports() {
  const { records, complaints, feedback, schedule, toast } = useStore();
  const [busy, setBusy] = useState(null);
  const [progress, setProgress] = useState(0);
  const [log, setLog] = useState([]);
  const timers = useRef([]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const buildRows = (key) => {
    if (key === "daily") {
      return [
        ["Record", "Student", "Reg no", "Block", "Room", "Items", "Weight (kg)", "Stage", "Handler", "Submitted"],
        ...records.map((r) => [r.id, r.student, r.regNo, r.block, r.room, r.itemCount, r.weightKg, r.status, r.staff, r.submittedAt]),
      ];
    }
    if (key === "complaints") {
      return [
        ["Ticket", "Student", "Record", "Category", "Status", "Raised", "Resolution"],
        ...complaints.map((c) => [c.id, c.student, c.recordId, c.category, c.status, c.createdAt, c.resolution || "—"]),
      ];
    }
    if (key === "feedback") {
      return [
        ["Rating id", "Record", "Student", "Overall", "Cleanliness", "Speed", "Care", "Comment", "Submitted"],
        ...feedback.map((f) => [f.id, f.recordId, f.student, f.overall, f.cleanliness, f.speed, f.care, f.note || "—", f.at]),
      ];
    }
    return [
      ["Block", "Collection day", "Records", "Pieces"],
      ...BLOCKS.map((b) => {
        const rs = records.filter((r) => r.block === b);
        return [b, schedule[b], rs.length, rs.reduce((t, r) => t + r.itemCount, 0)];
      }),
    ];
  };

  const run = (report, format) => {
    if (busy) return;
    setBusy(`${report.key}:${format}`);
    setProgress(8);
    timers.current.forEach(clearTimeout);
    timers.current = [30, 55, 78, 94].map((p, i) => setTimeout(() => setProgress(p), 220 * (i + 1)));

    timers.current.push(setTimeout(() => {
      const rows = buildRows(report.key);
      const date = dayOf(stamp());
      const base = `SHLMS_${report.key}_${date.replace(/\s/g, "")}`;
      const ok = format === "excel"
        ? downloadBlob(`${base}.csv`, "text/csv;charset=utf-8", buildCsv(rows))
        : downloadBlob(`${base}.pdf`, "application/pdf", buildPdf(
          report.title,
          [`Generated ${stamp()} · SHLMS frontend prototype`, ""].concat(
            rows.map((r) => r.map((c) => String(c)).join("  |  ")),
          ),
        ));

      setProgress(100);
      setLog((l) => [{
        id: uid("EXP"),
        text: `${report.title} — ${format === "excel" ? "Excel (CSV)" : "PDF"} · ${rows.length - 1} rows`,
        at: stamp(),
        ok,
      }, ...l].slice(0, 6));
      toast(ok ? `${report.title} downloaded` : "Report built, but the browser blocked the download", ok ? "success" : "danger");

      timers.current.push(setTimeout(() => { setBusy(null); setProgress(0); }, 500));
    }, 1150));
  };

  return (
    <div className="space-y-6">
      <Card className="p-5 sm:p-6">
        <SectionHeader
          title="Generate a report"
          subtitle="Reports are built from the live session state and downloaded straight from the browser."
        />
        <div className="grid gap-4 sm:grid-cols-2">
          {REPORTS.map((r) => {
            const running = busy && busy.startsWith(`${r.key}:`);
            return (
              <Card key={r.key} className="flex flex-col p-5">
                <div className="flex items-start gap-3">
                  <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
                    <r.icon size={17} />
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-900">{r.title}</p>
                    <p className="mt-0.5 text-xs leading-relaxed text-slate-500">{r.desc}</p>
                  </div>
                </div>

                <div className="mt-4 flex flex-wrap gap-2">
                  <Button size="sm" variant="secondary" disabled={!!busy} onClick={() => run(r, "pdf")}>
                    {running && busy.endsWith("pdf")
                      ? <><Loader2 size={13} className="animate-spin" /> Building…</>
                      : <><FileText size={13} /> PDF</>}
                  </Button>
                  <Button size="sm" variant="secondary" disabled={!!busy} onClick={() => run(r, "excel")}>
                    {running && busy.endsWith("excel")
                      ? <><Loader2 size={13} className="animate-spin" /> Building…</>
                      : <><FileSpreadsheet size={13} /> Excel</>}
                  </Button>
                  <span className="ml-auto self-center text-[11px] text-slate-400">
                    {buildRows(r.key).length - 1} rows
                  </span>
                </div>

                {running && <ProgressBar className="mt-3" value={progress} />}
              </Card>
            );
          })}
        </div>
      </Card>

      <Card className="p-5 sm:p-6">
        <SectionHeader title="Export history" subtitle="This session only — nothing is stored server-side." />
        {log.length === 0 ? (
          <EmptyState icon={Download} title="No exports yet" hint="Generated files appear here after you download them." />
        ) : (
          <ul className="divide-y divide-slate-100">
            {log.map((l) => (
              <li key={l.id} className="flex items-center justify-between py-3">
                <div className="flex items-center gap-3">
                  <div className={classNames(
                    "flex h-8 w-8 items-center justify-center rounded-lg",
                    l.ok ? "bg-emerald-50 text-emerald-600" : "bg-rose-50 text-rose-600",
                  )}>
                    {l.ok ? <Download size={15} /> : <XCircle size={15} />}
                  </div>
                  <div>
                    <p className="text-sm text-slate-800">{l.text}</p>
                    <p className="text-xs text-slate-400">{l.at}</p>
                  </div>
                </div>
                <StatusPill status={l.ok ? "Delivered" : "Open"} />
              </li>
            ))}
          </ul>
        )}
      </Card>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 11. Root — portal switch + shared store                             */
/* ------------------------------------------------------------------ */

function AppRoot() {
  const [portal, setPortal] = useState("landing");
  const back = () => setPortal("landing");

  return (
    <>
      <GlobalStyles />
      {portal === "landing" && <Landing onPick={setPortal} />}
      {portal === "student" && <StudentPortal onExit={back} />}
      {portal === "staff" && <StaffPortal onExit={back} />}
      {portal === "admin" && <AdminPortal onExit={back} />}
      <ToastHost />
    </>
  );
}

function SHLMSApp() {
  return (
    <StoreProvider>
      <AppRoot />
    </StoreProvider>
  );
}


/* ---- mount ---- */
ReactDOM.createRoot(document.getElementById("root")).render(<SHLMSApp />);
</script>
</body>
</html>
